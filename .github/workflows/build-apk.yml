name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Set up release signing (skipped if secrets are missing)
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS:-satlok}"
              echo "storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "::warning::Signing secrets missing - building with debug signing."
          fi

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Highlighter-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Highlighter-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Highlighter-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Highlighter-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
