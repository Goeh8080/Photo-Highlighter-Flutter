name: Dart

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true
